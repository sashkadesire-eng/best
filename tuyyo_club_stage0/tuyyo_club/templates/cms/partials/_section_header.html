<div class="mx-auto max-w-3xl space-y-3 text-center">
  {% if eyebrow %}
  <span class="inline-block rounded-full border border-sky-500/20 bg-sky-500/10 px-3.5 py-1.5 text-xs font-extrabold uppercase tracking-widest text-sky-600 dark:text-sky-400">{{ eyebrow }}</span>
  {% endif %}
  {% if title %}<h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white sm:text-4xl">{{ title }}</h2>{% endif %}
  {% if description %}<p class="mx-auto max-w-2xl text-sm leading-relaxed text-slate-600 dark:text-slate-400">{{ description }}</p>{% endif %}
</div>
