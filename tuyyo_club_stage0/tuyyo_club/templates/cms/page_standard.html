{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-4xl px-4 py-12 sm:px-6">
  {% if page.title %}
  <header class="mb-10 border-b border-slate-200 pb-6 dark:border-slate-800">
    <h1 class="text-3xl font-black text-slate-900 dark:text-white sm:text-4xl">{{ page.title }}</h1>
  </header>
  {% endif %}
  <div class="space-y-6">
    {% for section in sections %}{% include section.template_name %}{% endfor %}
  </div>
</div>
{% endblock %}
