[project]
name = "tuyyo-club"
version = "0.1.0"
description = "TUYYO.CLUB — Costa Blanca SUP Rental (Django SSR, i18n EN/ES)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]
